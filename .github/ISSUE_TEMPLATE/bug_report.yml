name: Bug report
description: Report a reproducible problem in EchoWave.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include cookies, account details, PO tokens, request headers, signed URLs, or copyrighted media.
  - type: input
    id: app-version
    attributes:
      label: EchoWave version
      description: Use the version shown in Settings → About, or the downloaded release tag.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 15
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Manufacturer and model
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect EchoWave to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include any visible error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Redact identifiers, tokens, cookies, headers, and complete media URLs before pasting.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed private data and credentials from this report.
          required: true
