name: android

on:
  push:
  pull_request:

jobs:
  build:
    # GitHub's Ubuntu 24.04 image includes the Android SDK and command-line tools.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # gradlew loses its exec bit on Windows checkouts; guarantee it here.
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug test --console=plain
