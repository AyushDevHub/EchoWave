name: Publish EchoWave APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
      - name: Create GitHub release and attach signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK_PATH="release-assets/EchoWave-${VERSION}.apk"
          SHA_PATH="release-assets/EchoWave-${VERSION}.apk.sha256"
          NOTES_PATH="docs/releases/${VERSION}.md"

          ASSETS=()
          if [ -f "$APK_PATH" ]; then
            ASSETS+=("$APK_PATH")
          fi
          if [ -f "$SHA_PATH" ]; then
            ASSETS+=("$SHA_PATH")
          fi

          NOTES_ARGS=()
          if [ -f "$NOTES_PATH" ]; then
            NOTES_ARGS+=(--notes-file "$NOTES_PATH")
          else
            NOTES_ARGS+=(--generate-notes)
          fi

          gh release create "$RELEASE_TAG" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "EchoWave ${VERSION}" \
            "${NOTES_ARGS[@]}"
